services:
  - type: web
    name: recoverix-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: RECOVERIX_DB_PATH
        value: /app/data/recoverix.db
      - key: RECOVERIX_TRUSTED_PROXIES
        value: "private"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RECOVERIX_CORS_ORIGINS
        sync: false

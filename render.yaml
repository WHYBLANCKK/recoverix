services:
  - type: web
    name: recoverix-backend-staging
    runtime: docker
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: RECOVERIX_DB_PATH
        value: /app/data/recoverix.db
      - key: RECOVERIX_TRUSTED_PROXIES
        value: "private"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RECOVERIX_CORS_ORIGINS
        value: "https://recoverix-staging.vercel.app,http://localhost:3000"
      - key: RECOVERIX_COOKIE_SECURE
        value: "1"
      - key: RECOVERIX_SESSION_SECRET
        generateValue: true

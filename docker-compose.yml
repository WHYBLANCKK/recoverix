services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: recoverix-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - RECOVERIX_DB_PATH=/app/data/recoverix.db
      - RECOVERIX_OFFLINE=${RECOVERIX_OFFLINE:-1}
      - RECOVERIX_CORS_ORIGINS=${RECOVERIX_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - recoverix_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: recoverix-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  recoverix_data:
    name: recoverix_data

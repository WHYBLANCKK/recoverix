name: Recoverix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests and Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for whitespace and git formatting errors
        run: git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build

      - name: Install dependencies in editable mode
        run: python -m pip install -e ".[dev]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify standalone wheel installation and CLI entrypoint
        run: |
          python -m pip install --force-reinstall --no-deps dist/recoverix-*.whl
          recoverix --help

      - name: Run pytest test suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest tests/ -q

      - name: Run baseline recovery benchmark
        run: PYTHONDONTWRITEBYTECODE=1 python -m benchmark.run_baseline

      - name: Run marker-free JSON recovery benchmark
        run: PYTHONDONTWRITEBYTECODE=1 python -m benchmark.json_benchmark

  frontend:
    name: Frontend TypeScript Validation and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run TypeScript compiler check
        run: npx --prefix frontend tsc -p frontend/tsconfig.json --noEmit

      - name: Run frontend production build
        run: npm run build --prefix frontend
